<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Gimbie Hospital</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="contact.css" />
</head>
<body>
    <div id="loader">
        <div class="loader-content">
            <div class="loader-logo">🏥</div>
            <div class="loader-text">Loading...</div>
            <div class="loader-spinner"></div>
        </div>
    </div>

    <div id="header"></div>

    <section class="page-section">
        <div class="container">
            <div class="page-header">
                <span class="section-tag">Contact</span>
                <h1 class="page-title">Get in Touch</h1>
                <p class="page-subtitle">We're here to help. Reach out to us anytime.</p>
            </div>

            <div class="contact-wrapper">
                <div class="contact-info glass">
                    <h3>📞 Contact Information</h3>
                    <div class="contact-item">
                        <span class="contact-item-icon">📞</span>
                        <div>
                            <strong>Phone</strong>
                            <p>+251-XXX-XXXXXX</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <span class="contact-item-icon">📧</span>
                        <div>
                            <strong>Email</strong>
                            <p>info@gimbiehospital.org</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <span class="contact-item-icon">📍</span>
                        <div>
                            <strong>Address</strong>
                            <p>Gimbie, Ethiopia</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <span class="contact-item-icon">🕐</span>
                        <div>
                            <strong>Working Hours</strong>
                            <p>Monday - Friday: 8:00 AM - 5:00 PM</p>
                            <p>Emergency: 24/7</p>
                        </div>
                    </div>
                </div>

                <div class="contact-form glass">
                    <h3>📝 Send a Message</h3>
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="contactName">Your Name</label>
                            <input type="text" id="contactName" placeholder="Enter your full name" required />
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">Email Address</label>
                            <input type="email" id="contactEmail" placeholder="Enter your email" required />
                        </div>
                        <div class="form-group">
                            <label for="contactSubject">Subject</label>
                            <input type="text" id="contactSubject" placeholder="What is this about?" required />
                        </div>
                        <div class="form-group">
                            <label for="contactMessage">Message</label>
                            <textarea id="contactMessage" rows="5" placeholder="Your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-large btn-full">
                            <span class="btn-icon">📨</span> Send Message
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="components/header.html.js"></script>
    <script src="components/footer.html.js"></script>
    <script src="api.js"></script>
    <script src="contact.js"></script>
    <script src="main.js"></script>
</body>
                              </html>
